<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080808">
<title>Ishyn Music</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08090b;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:105px;
}

.app{
  max-width:560px;
  margin:auto;
  padding:18px 16px 120px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:27px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:#1db954;
}

.fav{
  width:42px;
  height:42px;
  border:1px solid #292d32;
  border-radius:50%;
  background:#15171a;
  color:#aaa;
  font-size:20px;
}

.fav.active{
  color:#1db954;
}

.search{
  width:100%;
  padding:15px 18px;
  border:1px solid #292d32;
  border-radius:16px;
  background:#15171a;
  color:white;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

.search:focus{
  border-color:#1db954;
}

.hero{
  padding:28px 22px;
  border-radius:24px;
  background:linear-gradient(145deg,#20242a,#101214);
  border:1px solid #292d32;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
  margin-bottom:26px;
}

.hero h1{
  margin:0 0 8px;
  font-size:30px;
  line-height:1.15;
}

.hero p{
  margin:0;
  color:#9b9da2;
  font-size:15px;
}

.section-title{
  margin:26px 2px 14px;
  font-size:22px;
  font-weight:800;
}

.song{
  display:flex;
  align-items:center;
  gap:13px;
  background:#15171a;
  border:1px solid #202328;
  border-radius:18px;
  padding:11px;
  margin-bottom:11px;
  transition:.2s;
}

.song:active{
  transform:scale(.98);
}

.cover{
  width:56px;
  height:56px;
  flex-shrink:0;
  border-radius:14px;
  background:linear-gradient(135deg,#1db954,#0b5d2c);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.songinfo{
  flex:1;
  min-width:0;
}

.songname{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  color:#888d94;
  font-size:13px;
  margin-top:5px;
}

.play{
  width:44px;
  height:44px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:#1db954;
  color:#000;
  font-size:18px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}

.play:active{
  transform:scale(.9);
}

.empty{
  text-align:center;
  color:#777;
  padding:45px 15px;
}

.upload{
  width:100%;
  padding:16px;
  margin-top:14px;
  border:1px solid #30343a;
  border-radius:17px;
  background:#17191c;
  color:#fff;
  font-size:15px;
}

nav{
  position:fixed;
  z-index:10;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(560px,100%);
  background:rgba(16,17,19,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid #292d32;
  display:flex;
  justify-content:space-around;
  padding:10px 5px 14px;
}

nav button{
  background:none;
  border:0;
  color:#777d85;
  font-size:12px;
  padding:5px 12px;
}

nav button.active{
  color:#fff;
}

nav span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

#player{
  position:fixed;
  z-index:11;
  bottom:72px;
  left:50%;
  transform:translateX(-50%);
  width:min(530px,calc(100% - 20px));
  background:#191c20;
  border:1px solid #30343a;
  border-radius:20px;
  padding:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.5);
}

.playerrow{
  display:flex;
  align-items:center;
  gap:11px;
}

.playerrow .cover{
  width:48px;
  height:48px;
  border-radius:12px;
  font-size:20px;
}

.ptext{
  flex:1;
  min-width:0;
}

.name{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.controls{
  display:flex;
  align-items:center;
  gap:7px;
}

.controls button{
  border:0;
  background:#292d32;
  color:#fff;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:15px;
}

.controls .mainplay{
  background:#1db954;
  color:#000;
  width:42px;
  height:42px;
}

.progress{
  width:100%;
  margin-top:10px;
  height:4px;
  border-radius:10px;
  background:#333;
  overflow:hidden;
}

.progress div{
  height:100%;
  width:35%;
  background:#1db954;
  border-radius:10px;
}

hr{
  border:0;
  border-top:1px solid #22262b;
  margin:22px 0;
}

/* ===== ISHYN PREMIUM DESIGN ===== */

.fav{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#15171a !important;
  border:1px solid #30343a !important;
  color:#b8bec5 !important;
  font-size:19px;
  box-shadow:0 5px 18px rgba(0,0,0,.25);
}

.fav:active{
  transform:scale(.92);
}

.hero{
  background:
    radial-gradient(circle at 90% 10%,rgba(29,185,84,.18),transparent 38%),
    linear-gradient(145deg,#1b2024,#101214) !important;
  border:1px solid #292e33 !important;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.hero h1{
  letter-spacing:-1px;
}

.song{
  background:linear-gradient(145deg,#181b1f,#121416) !important;
  border:1px solid #252a2f !important;
  box-shadow:0 7px 20px rgba(0,0,0,.22);
}

.song:active{
  transform:scale(.98);
}

.cover{
  background:linear-gradient(135deg,#1ed760,#08752f) !important;
  box-shadow:inset 0 0 15px rgba(255,255,255,.08);
}

.play{
  background:#1ed760 !important;
  box-shadow:0 4px 14px rgba(29,185,84,.25);
}

.play:active{
  transform:scale(.9);
}

#player{
  background:rgba(24,27,31,.97) !important;
  border:1px solid #30353b !important;
  border-radius:20px !important;
  box-shadow:0 15px 40px rgba(0,0,0,.55) !important;
  backdrop-filter:blur(18px);
}

#player .cover{
  box-shadow:0 5px 18px rgba(0,0,0,.35);
}

.controls{
  gap:8px;
}

.controls button{
  background:#292e34 !important;
  transition:.18s;
}

.controls button:active{
  transform:scale(.88);
}

.controls .mainplay{
  background:#1ed760 !important;
  color:#000 !important;
  box-shadow:0 4px 15px rgba(29,185,84,.3);
}

nav{
  background:rgba(12,14,16,.96) !important;
  backdrop-filter:blur(20px);
  box-shadow:0 -8px 30px rgba(0,0,0,.25);
}

nav button{
  transition:.2s;
}

nav button.active{
  color:#1ed760 !important;
}

nav button:active{
  transform:scale(.9);
}

.upload{
  background:#15181b !important;
  border-color:#30353a !important;
  transition:.2s;
}

.upload:active{
  transform:scale(.98);
}

.search{
  background:#15181b !important;
  border-color:#292e33 !important;
  box-shadow:0 5px 18px rgba(0,0,0,.2);
}

.search:focus{
  border-color:#1ed760 !important;
}

.section-title{
  letter-spacing:-.5px;
}
/* Premium Settings Button */

.icon{
  width:42px !important;
  height:42px !important;
  border-radius:50% !important;
  border:1px solid #30343a !important;
  background:#15181b !important;
  color:#d7dadd !important;
  font-size:20px !important;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 18px rgba(0,0,0,.3);
}

.icon:active{
  transform:scale(.9);
  background:#1c2024 !important;
}

.icon:hover{
  border-color:#1ed760 !important;
  color:#1ed760 !important;
}
 header .icon{
  width:42px !important;
  height:42px !important;
  border-radius:50% !important;
  background:#15181b !important;
  border:1px solid #30343a !important;
  color:#fff !important;
  font-size:20px !important;
 }
  #splash{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#08090b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  animation:splashOut .8s ease 3.5s forwards;
}

.splash-logo{
  font-size:52px;
  font-weight:800;
  margin-bottom:20px;
}

.splash-logo span{
  color:#1db954;
}

.splash-credit{
  font-size:18px;
  color:#aaa;
  animation:creditIn 1s ease 1.5s both;
}

@keyframes creditIn{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes splashOut{
  to{opacity:0;visibility:hidden}
}
</style>
</head>

<body>
  <div id="splash">
  <div class="splash-logo">Ish<span>yn</span></div>
  <div class="splash-credit">Developed by Shubham Rawat</div>
  </div>
<div class="app">

<header>
 <div class="logo">Ish<span>yn</span></div>
 <button class="icon" onclick="show('settings')">⚙</button>
</header>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
<div id="googleLogin" style="margin:15px;text-align:center;">
  <div
    id="g_id_onload"
    data-client_id="930545452909-r082ne23agck06edoq2fvbvsp4l26bdn.apps.googleusercontent.com"
    data-callback="handleCredentialResponse"
    data-auto_prompt="false">
  </div>

  <div class="g_id_signin"
    data-type="standard"
    data-size="large"
    data-theme="filled_black"
    data-text="signin_with">
  </div>
</div>
<main id="main"></main>

</div>

<div id="player">
 <div class="playerrow">
  <div class="cover">♫</div>
  <div class="ptext">
   <div class="pname" id="pname">Nothing playing</div>
   <div class="artist" id="partist">Ishyn Music</div>
  </div>
  <div class="controls">
   <button onclick="prev()">⏮</button>
   <button class="mainplay" id="playbtn" onclick="togglePlay()">▶</button>
   <button onclick="next()">⏭</button>
  </div>
 </div>
 <input class="progress" id="progress" type="range" min="0" max="100" value="0"
        oninput="seek(this.value)">
</div>

<nav>
 <button class="active" onclick="show('home',this)">
  <span>⌂</span>Home
 </button>
 <button onclick="show('search',this)">
  <span>⌕</span>Search
 </button>
 <button onclick="show('library',this)">
  <span>♫</span>Songs
 </button>
 <button onclick="show('settings',this)">
  <span>⚙</span>Settings
 </button>
</nav>

<audio id="audio"></audio>

<script>
const main=document.getElementById("main");
const audio=document.getElementById("audio");
const pname=document.getElementById("pname");
const partist=document.getElementById("partist");
const playbtn=document.getElementById("playbtn");
const progress=document.getElementById("progress");

let songs=[];
let current=-1;
let db;

const request=indexedDB.open("IshynMusicDB",1);

request.onupgradeneeded=e=>{
 db=e.target.result;
 if(!db.objectStoreNames.contains("songs")){
  db.createObjectStore("songs",{keyPath:"id",autoIncrement:true});
 }
};

request.onsuccess=e=>{
 db=e.target.result;
 loadSongs();
};

request.onerror=()=>{
 alert("Storage error. Please reload the page.");
};

function loadSongs(){
 const tx=db.transaction("songs","readonly");
 const store=tx.objectStore("songs");
 const req=store.getAll();

 req.onsuccess=()=>{
  songs=req.result;
  renderHome();
 };
}

function saveSong(song){
 const tx=db.transaction("songs","readwrite");
 tx.objectStore("songs").add(song);
 tx.oncomplete=()=>loadSongs();
}

function deleteSong(id){
 const tx=db.transaction("songs","readwrite");
 tx.objectStore("songs").delete(id);
 tx.oncomplete=()=>{
  if(current>=0 && songs[current] && songs[current].id===id){
   audio.pause();
   audio.src="";
   current=-1;
   document.getElementById("player").style.display="none";
  }
  loadSongs();
 };
}

function show(page,btn){

 if(btn){
  document.querySelectorAll("nav button")
   .forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
 }

 if(page==="home") renderHome();
 else if(page==="search") renderSearch();
 else if(page==="library") renderLibrary();
 else renderSettings();
}

function renderHome(){

 main.innerHTML=`
 <div class="hero">
   <h1>Welcome to Ishyn 🎵</h1>
   <p>Your personal music space</p>
   <label>
    <input id="file" type="file" accept="audio/*" multiple hidden
           onchange="addFiles(this.files)">
    <div class="upload">＋ Add songs from phone</div>
   </label>
 </div>

 <div class="section-title">Recently added</div>
 <div id="homeList"></div>
 `;

 renderList(
  document.getElementById("homeList"),
  songs.slice().reverse().slice(0,8)
 );
}

function renderLibrary(){

 main.innerHTML=`
 <div class="section-title">🎵 My Songs</div>
 <label>
  <input id="file" type="file" accept="audio/*" multiple hidden
         onchange="addFiles(this.files)">
  <div class="upload">＋ Add MP3 / Audio</div>
 </label>
 <div id="libraryList" style="margin-top:18px"></div>
 `;

 renderList(document.getElementById("libraryList"),songs);
}

function renderSearch(){

 main.innerHTML=`
 <button class="back" onclick="show('home')">‹</button>
 <input id="searchBox" class="search"
   placeholder="Search your songs..."
   oninput="doSearch(this.value)">
 <div id="results" style="margin-top:18px"></div>
 `;

 doSearch("");
}

function doSearch(q){

 const box=document.getElementById("results");
 if(!box)return;

 q=q.toLowerCase();

 const found=songs.filter(s=>
   s.name.toLowerCase().includes(q) ||
   (s.artist||"").toLowerCase().includes(q)
 );

 renderList(box,found);
}

function renderList(box,list){

 if(!list.length){
  box.innerHTML=`
   <div class="empty">
    No songs yet.<br><br>
    Add an MP3 from your phone.
   </div>`;
  return;
 }

 box.innerHTML="";

 list.forEach((s)=>{
  const realIndex=songs.findIndex(x=>x.id===s.id);

  const el=document.createElement("div");
  el.className="song";

  el.innerHTML=`
   <div class="cover">♫</div>
   <div class="songinfo">
    <div class="songname">${esc(s.name)}</div>
    <div class="artist">${esc(s.artist||"Unknown artist")}</div>
   </div>
   <button class="play" onclick="play(${realIndex})">▶</button>
  `;

  box.appendChild(el);
 });
}

function esc(x){
 return String(x).replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[m]));
}

function addFiles(files){

 if(!files || !files.length)return;

 [...files].forEach(file=>{

  if(!file.type.startsWith("audio/")){
   return;
  }

  saveSong({
   name:file.name.replace(/\.[^/.]+$/,""),
   artist:"Local song",
   blob:file,
   added:Date.now()
  });

 });

 alert("Songs saved to Ishyn 🎵");
}

function play(index){

 if(index<0 || !songs[index])return;

 current=index;

 const song=songs[index];

 const url=URL.createObjectURL(song.blob);

 audio.src=url;

 pname.textContent=song.name;
 partist.textContent=song.artist||"Local song";

 document.getElementById("player").style.display="block";

 audio.play()
  .then(()=>{
   playbtn.textContent="⏸";
  })
  .catch(()=>{
   alert("Song play nahi ho raha. Please try again.");
  });
}

function togglePlay(){

 if(current<0){
  if(songs.length)play(0);
  return;
 }

 if(audio.paused){
  audio.play();
  playbtn.textContent="⏸";
 }else{
  audio.pause();
  playbtn.textContent="▶";
 }
}

function next(){

 if(!songs.length)return;

 let i=current+1;

 if(i>=songs.length)i=0;

 play(i);
}

function prev(){

 if(!songs.length)return;

 let i=current-1;

 if(i<0)i=songs.length-1;

 play(i);
}

audio.addEventListener("ended",()=>{
 next();
});

audio.addEventListener("timeupdate",()=>{

 if(!audio.duration)return;

 progress.value=(audio.currentTime/audio.duration)*100;
});

function seek(value){

 if(!audio.duration)return;

 audio.currentTime=(value/100)*audio.duration;
}

function renderSettings(){

 main.innerHTML=`
 <button class="back" onclick="show('home')">‹</button>

 <div class="hero">
  <h1>Ishyn Music</h1>
  <p>Created by Shubham Rawat</p>
 </div>

 <div class="section-title">Storage</div>

 <div class="song">
  <div class="cover">♪</div>
  <div class="songinfo">
   <div class="songname">${songs.length} Songs saved</div>
   <div class="artist">Songs stay saved on this browser</div>
  </div>
 </div>

 <button class="upload" onclick="clearSongs()">
  🗑 Clear all songs
 </button>
 `;
}

function clearSongs(){

 if(!songs.length)return;

 if(!confirm("Delete all saved songs?"))return;

 const tx=db.transaction("songs","readwrite");

 tx.objectStore("songs").clear();

 tx.oncomplete=()=>{
  songs=[];
  current=-1;
  audio.pause();
  audio.src="";
  document.getElementById("player").style.display="none";
  renderSettings();
 };
}

function renderSearchAgain(){
 renderSearch();
}

function renderAll(){
 show("home");
}

window.addEventListener("load",()=>{
 setTimeout(()=>{
  if(db)loadSongs();
 },500);
});
</script>

</body>
</html>

<script>

const main = document.getElementById("main");
const audio = document.getElementById("audio");
const player = document.getElementById("player");
const playerName = document.getElementById("playerName");
const playerArtist = document.getElementById("playerArtist");
const playButton = document.getElementById("playButton");
const progress = document.getElementById("progress");

let songs = [];
let currentIndex = -1;
let objectURL = null;

const DB_NAME = "IshynMusicDB";
const STORE_NAME = "songs";

let db = null;


/* =========================
   DATABASE
========================= */

const dbRequest = indexedDB.open(DB_NAME, 1);

dbRequest.onupgradeneeded = function(event) {

  db = event.target.result;

  if (!db.objectStoreNames.contains(STORE_NAME)) {

    db.createObjectStore(STORE_NAME, {
      keyPath: "id"
    });

  }

};

dbRequest.onsuccess = function(event) {

  db = event.target.result;

  loadSongs();

};

dbRequest.onerror = function() {

  alert("Storage open nahi ho paya.");

};


/* =========================
   LOAD SONGS
========================= */

function loadSongs() {

  if (!db) return;

  const tx = db.transaction(
    STORE_NAME,
    "readonly"
  );

  const store = tx.objectStore(
    STORE_NAME
  );

  const request = store.getAll();

  request.onsuccess = function() {

    songs = request.result || [];

    renderHome();

  };

}


/* =========================
   SAVE SONG
========================= */

function saveSong(song) {

  if (!db) return;

  const tx = db.transaction(
    STORE_NAME,
    "readwrite"
  );

  const store = tx.objectStore(
    STORE_NAME
  );

  store.put(song);

  tx.onerror = function() {

    alert("Song save nahi ho paya.");

  };

}


/* =========================
   ADD SONGS
========================= */

function addLocalSongs(files) {

  if (!files || !files.length) return;

  let added = 0;

  [...files].forEach(file => {

    if (!file.type.startsWith("audio/")) {
      return;
    }

    const song = {

      id: Date.now() + Math.random(),

      name: file.name.replace(
        /\.[^/.]+$/,
        ""
      ),

      artist: "Local Music",

      file: file,

      liked: false

    };

    songs.push(song);

    saveSong(song);

    added++;

  });

  if (added) {

    alert(
      added +
      " song Ishyn me save ho gaya 🎵"
    );

    renderHome();

  }

}


/* =========================
   PAGE SYSTEM
========================= */

function showPage(page, button) {

  document
    .querySelectorAll("nav button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  if (button) {
    button.classList.add("active");
  }

  if (page === "home") {
    renderHome();
  }

  else if (page === "search") {
    renderSearch();
  }

  else if (page === "songs") {
    renderSongs();
  }

  else if (page === "liked") {
    renderLiked();
  }

  else if (page === "settings") {
    renderSettings();
  }

}


/* =========================
   HOME
========================= */

function renderHome() {

  main.innerHTML = `

    <div class="hero">

      <h1>Welcome to Ishyn 🎵</h1>

      <p>
        Your personal music space
      </p>

      <label class="upload">

        ＋ Add songs from phone

        <input
          type="file"
          accept="audio/*"
          multiple
          hidden
          onchange="addLocalSongs(this.files)"
        >

      </label>

    </div>


    <div class="categories">

      <button class="category">
        Romance
      </button>

      <button class="category">
        Relax
      </button>

      <button class="category">
        Feel Good
      </button>

      <button class="category">
        Energize
      </button>

      <button class="category">
        Party
      </button>

    </div>


    <div class="section-head">

      <div class="section-title">
        Recently Added
      </div>

      <button
        class="arrow"
        onclick="showPage('songs')">
        →
      </button>

    </div>

    <div id="homeSongs"></div>


    <div class="section-head">

      <div class="section-title">
        Ishyn Music
      </div>

    </div>

    <div class="hero">

      <h1>🎧 Listen your way</h1>

      <p>
        Add your music and enjoy it inside Ishyn.
      </p>

    </div>

  `;

  renderSongList(
    document.getElementById("homeSongs"),
    songs.slice().reverse().slice(0, 6)
  );

}


/* =========================
   SONGS PAGE
========================= */

function renderSongs() {

  main.innerHTML = `

    <div class="section-head">

      <div class="section-title">
        My Songs 🎵
      </div>

    </div>


    <label class="upload">

      ＋ Add MP3 / Audio

      <input
        type="file"
        accept="audio/*"
        multiple
        hidden
        onchange="addLocalSongs(this.files)"
      >

    </label>


    <div id="songsList"></div>

  `;

  renderSongList(
    document.getElementById("songsList"),
    songs
  );

}


/* =========================
   SEARCH
========================= */

function renderSearch() {

  main.innerHTML = `

    <div class="section-title">
      Search
    </div>

    <input
      id="searchInput"
      class="search"
      placeholder="Search singer or song..."
      oninput="searchSongs(this.value)"
    >

    <div id="searchResults"></div>

  `;

  searchSongs("");

}


function searchSongs(query) {

  const box =
    document.getElementById("searchResults");

  if (!box) return;

  query =
    query.toLowerCase().trim();

  if (!query) {

    box.innerHTML = `

      <div class="empty">

        🔎<br><br>

        Search your saved songs

      </div>

    `;

    return;

  }

  const result = songs.filter(song =>

    song.name
      .toLowerCase()
      .includes(query)

    ||

    song.artist
      .toLowerCase()
      .includes(query)

  );

  renderSongList(box, result);

}


/* =========================
   LIKED
========================= */

function renderLiked() {

  main.innerHTML = `

    <div class="section-title">
      ❤️ Liked Songs
    </div>

    <div id="likedList"></div>

  `;

  const liked =
    songs.filter(song => song.liked);

  renderSongList(
    document.getElementById("likedList"),
    liked
  );

}


/* =========================
   SETTINGS
========================= */

function renderSettings() {

  main.innerHTML = `

    <button
      class="back"
      onclick="showPage('home')">
      ‹ Back
    </button>


    <div class="hero">

      <h1>Ishyn Music</h1>

      <p>
        Developed by Shubham Rawat
      </p>

    </div>


    <div class="section-title">
      Settings
    </div>


    <div class="setting">

      <div>

        <div class="setting-title">
          🎵 Music
        </div>

        <div class="setting-sub">
          Personal music player
        </div>

      </div>

    </div>


    <div
      class="setting"
      onclick="alert('${songs.length} songs saved on this device')">

      <div>

        <div class="setting-title">
          💾 Storage
        </div>

        <div class="setting-sub">
          ${songs.length} songs saved
        </div>

      </div>

    </div>


    <div
      class="setting"
      onclick="aboutIshyn()">

      <div>

        <div class="setting-title">
          ℹ️ About Ishyn
        </div>

        <div class="setting-sub">
          Ishyn Music<br>
          Developed by Shubham Rawat
        </div>

      </div>

    </div>


    <button
      class="upload"
      onclick="clearSongs()">

      🗑 Clear saved songs

    </button>

  `;

}


/* =========================
   ABOUT
========================= */

function aboutIshyn() {

  alert(
    "Ishyn Music\n\n" +
    "Developed by Shubham Rawat\n\n" +
    "Version 1.0"
  );

}


/* =========================
   SONG LIST
========================= */

function renderSongList(box, list) {

  if (!box) return;

  if (!list.length) {

    box.innerHTML = `

      <div class="empty">

        🎵<br><br>

        No songs found.<br>

        Add an MP3 from your phone.

      </div>

    `;

    return;

  }

  box.innerHTML = "";

  list.forEach(song => {

    const realIndex =
      songs.findIndex(
        s => s.id === song.id
      );

    const div =
      document.createElement("div");

    div.className = "song";

    div.innerHTML = `

      <div class="cover">
        ♫
      </div>


      <div class="songinfo">

        <div class="songname">
          ${escapeHTML(song.name)}
        </div>

        <div class="artist">
          ${escapeHTML(song.artist)}
        </div>

      </div>


      <button
        class="like ${song.liked ? "active" : ""}"
        onclick="toggleLike(${realIndex})">

        ${song.liked ? "♥" : "♡"}

      </button>


      <button
        class="play"
        onclick="playSong(${realIndex})">

        ▶

      </button>

    `;

    box.appendChild(div);

  });

}


/* =========================
   PLAY SONG
========================= */

function playSong(index) {

  if (
    index < 0 ||
    !songs[index]
  ) {
    return;
  }

  const song = songs[index];

  if (!song.file) {

    alert(
      "Song file available nahi hai."
    );

    return;

  }

  currentIndex = index;

  if (objectURL) {

    URL.revokeObjectURL(
      objectURL
    );

  }

  objectURL =
    URL.createObjectURL(song.file);

  audio.src = objectURL;

  playerName.textContent =
    song.name;

  playerArtist.textContent =
    song.artist;

  player.style.display =
    "block";

  progress.value = 0;

  audio.play()
    .then(() => {

      playButton.textContent =
        "⏸";

    })
    .catch(() => {

      alert(
        "Song play nahi ho raha."
      );

    });

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

  if (currentIndex < 0) {

    if (songs.length) {
      playSong(0);
    }

    return;

  }

  if (audio.paused) {

    audio.play()
      .then(() => {

        playButton.textContent =
          "⏸";

      });

  }

  else {

    audio.pause();

    playButton.textContent =
      "▶";

  }

}


/* =========================
   NEXT
========================= */

function nextSong() {

  if (!songs.length) return;

  let next =
    currentIndex + 1;

  if (
    next >= songs.length
  ) {
    next = 0;
  }

  playSong(next);

}


/* =========================
   PREVIOUS
========================= */

function previousSong() {

  if (!songs.length) return;

  let previous =
    currentIndex - 1;

  if (previous < 0) {

    previous =
      songs.length - 1;

  }

  playSong(previous);

}


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
  "ended",
  nextSong
);


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
  "timeupdate",
  () => {

    if (!audio.duration) return;

    progress.value =
      (
        audio.currentTime /
        audio.duration
      ) * 100;

  }
);


progress.addEventListener(
  "input",
  () => {

    if (!audio.duration) return;

    audio.currentTime =
      (
        progress.value / 100
      ) * audio.duration;

  }
);


/* =========================
   LIKE
========================= */

function toggleLike(index) {

  if (
    index < 0 ||
    !songs[index]
  ) {
    return;
  }

  songs[index].liked =
    !songs[index].liked;

  saveSong(songs[index]);

  renderHome();

}


/* =========================
   CLEAR SONGS
========================= */

function clearSongs() {

  if (!songs.length) {

    alert("No songs saved.");

    return;

  }

  const ok =
    confirm(
      "Delete all saved songs?"
    );

  if (!ok) return;

  const tx =
    db.transaction(
      STORE_NAME,
      "readwrite"
    );

  tx.objectStore(
    STORE_NAME
  ).clear();

  tx.oncomplete = function() {

    songs = [];

    currentIndex = -1;

    audio.pause();

    audio.src = "";

    if (objectURL) {

      URL.revokeObjectURL(
        objectURL
      );

      objectURL = null;

    }

    player.style.display =
      "none";

    renderSettings();

  };

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

  return String(text).replace(
    /[&<>"']/g,
    function(m) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      }[m];

    }
  );

}


/* =========================
   SPLASH
========================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    setTimeout(() => {

      const splash =
        document.getElementById(
          "splash"
        );

      splash.style.opacity =
        "0";

      splash.style.pointerEvents =
        "none";

      setTimeout(() => {

        splash.style.display =
          "none";

      }, 500);

    }, 2500);

  }
);

</script>

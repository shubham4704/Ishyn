<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090b">
<title>Ishyn Music</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 min-height:100%;
 background:#09090b;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
}

body{
 padding-bottom:110px;
 background:
 radial-gradient(circle at 20% 0%,rgba(235,170,167,.10),transparent 32%),
 #09090b;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
 width:100%;
 max-width:620px;
 margin:auto;
 padding:18px 15px 135px;
}

/* ================= SPLASH ================= */

#splash{
 position:fixed;
 inset:0;
 z-index:99999;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 background:#09090b;
 transition:opacity .6s ease;
}

.splashLogo{
 font-size:64px;
 font-weight:900;
 letter-spacing:-5px;
}

.splashLogo span{
 color:#e8aaa6;
}

.splashCredit{
 margin-top:15px;
 color:#999;
 font-size:16px;
}

/* ================= HEADER ================= */

header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:20px;
}

.logo{
 font-size:33px;
 font-weight:900;
 letter-spacing:-2px;
}

.logo span{
 color:#e8aaa6;
}

.iconButton{
 width:45px;
 height:45px;
 border-radius:50%;
 border:1px solid #342a2c;
 background:#171315;
 color:#fff;
 font-size:20px;
}

/* ================= HERO ================= */

.hero{
 position:relative;
 overflow:hidden;
 padding:27px 22px;
 border-radius:27px;
 margin-bottom:22px;
 border:1px solid #3b2d2f;
 background:
 radial-gradient(circle at 90% 5%,rgba(232,170,166,.25),transparent 35%),
 linear-gradient(145deg,#302426,#151113);
 box-shadow:0 18px 45px rgba(0,0,0,.35);
}

.hero h1{
 margin:0 0 9px;
 font-size:30px;
 letter-spacing:-1px;
}

.hero p{
 margin:0;
 color:#aaa;
 line-height:1.5;
}

/* ================= BUTTON ================= */

.primaryButton{
 display:block;
 width:100%;
 margin-top:18px;
 padding:15px;
 border:0;
 border-radius:17px;
 background:#e8aaa6;
 color:#171112;
 font-weight:800;
 text-align:center;
}

.secondaryButton{
 width:100%;
 padding:15px;
 border-radius:17px;
 border:1px solid #403133;
 background:#1b1517;
 color:#fff;
}

/* ================= CHIPS ================= */

.chips{
 display:flex;
 gap:9px;
 overflow-x:auto;
 margin:5px 0 25px;
}

.chips::-webkit-scrollbar{
 display:none;
}

.chip{
 flex-shrink:0;
 padding:10px 15px;
 border-radius:14px;
 border:1px solid #302629;
 background:#171315;
 color:#aaa;
}

.chip.active{
 color:#e8aaa6;
 border-color:#604447;
 background:#39282a;
}

/* ================= SECTION ================= */

.sectionHeader{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:25px 2px 14px;
}

.sectionTitle{
 font-size:23px;
 font-weight:800;
}

.more{
 border:0;
 background:none;
 color:#e8aaa6;
}

/* ================= SONG ================= */

.song{
 display:flex;
 align-items:center;
 gap:11px;
 padding:11px;
 margin-bottom:10px;
 border-radius:18px;
 border:1px solid #292124;
 background:linear-gradient(145deg,#191517,#121012);
}

.cover{
 width:57px;
 height:57px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:14px;
 background:linear-gradient(135deg,#aa706d,#382426);
 font-size:24px;
}

.songInfo{
 flex:1;
 min-width:0;
}

.songName{
 font-weight:700;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.artist{
 margin-top:5px;
 color:#8d8788;
 font-size:13px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.likeButton{
 width:36px;
 height:36px;
 border:0;
 background:none;
 color:#777;
 font-size:21px;
}

.likeButton.active{
 color:#e8aaa6;
}

.playButton{
 width:43px;
 height:43px;
 flex-shrink:0;
 border:0;
 border-radius:50%;
 background:#e8aaa6;
 color:#171112;
 font-weight:900;
}

/* ================= SEARCH ================= */

.search{
 width:100%;
 padding:16px 18px;
 margin-bottom:18px;
 border-radius:17px;
 border:1px solid #302629;
 outline:none;
 background:#151214;
 color:#fff;
}

.search:focus{
 border-color:#e8aaa6;
}

/* ================= EMPTY ================= */

.empty{
 padding:55px 15px;
 text-align:center;
 color:#777;
 line-height:1.6;
}

/* ================= PLAYER ================= */

#player{
 position:fixed;
 display:none;
 z-index:500;
 left:50%;
 bottom:82px;
 transform:translateX(-50%);
 width:min(590px,calc(100% - 18px));
 padding:12px;
 border-radius:21px;
 border:1px solid #49383a;
 background:rgba(30,23,24,.97);
 box-shadow:0 18px 45px rgba(0,0,0,.65);
 backdrop-filter:blur(18px);
}

.playerRow{
 display:flex;
 align-items:center;
 gap:10px;
}

.playerCover{
 width:49px;
 height:49px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:13px;
 background:linear-gradient(135deg,#aa706d,#382426);
 font-size:20px;
}

.playerInfo{
 flex:1;
 min-width:0;
}

.playerName{
 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.playerArtist{
 margin-top:4px;
 color:#8d8788;
 font-size:12px;
}

.controls{
 display:flex;
 align-items:center;
 gap:5px;
}

.controls button{
 width:37px;
 height:37px;
 border:0;
 border-radius:50%;
 background:#382c2e;
 color:#fff;
}

.controls .main{
 width:42px;
 height:42px;
 background:#e8aaa6;
 color:#171112;
}

#progress{
 width:100%;
 margin-top:9px;
 accent-color:#e8aaa6;
}

/* ================= NAV ================= */

nav{
 position:fixed;
 z-index:600;
 left:50%;
 bottom:8px;
 transform:translateX(-50%);
 width:min(590px,calc(100% - 24px));
 display:flex;
 padding:7px;
 border-radius:28px;
 border:1px solid #423234;
 background:rgba(25,19,20,.97);
 box-shadow:0 12px 35px rgba(0,0,0,.55);
 backdrop-filter:blur(20px);
}

nav button{
 flex:1;
 padding:8px 2px;
 border:0;
 border-radius:21px;
 background:none;
 color:#777;
 font-size:11px;
}

nav button.active{
 color:#e8aaa6;
 background:#3b292a;
}

nav span{
 display:block;
 margin-bottom:3px;
 font-size:21px;
}

/* ================= SETTINGS ================= */

.back{
 border:0;
 background:none;
 color:#e8aaa6;
 font-size:30px;
 padding:0;
 margin-bottom:12px;
}

.setting{
 display:flex;
 align-items:center;
 gap:13px;
 padding:16px;
 margin-bottom:10px;
 border:1px solid #292124;
 border-radius:17px;
 background:#171315;
}

.settingIcon{
 width:42px;
 height:42px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:13px;
 background:#2a2022;
 font-size:19px;
}

.settingText{
 flex:1;
}

.settingTitle{
 font-weight:800;
}

.settingSub{
 margin-top:4px;
 color:#858081;
 font-size:12px;
}

.chevron{
 color:#777;
 font-size:20px;
}

.infoBox{
 padding:16px;
 margin-bottom:15px;
 border-radius:17px;
 border:1px solid #302629;
 background:#151214;
 color:#aaa;
 line-height:1.6;
 font-size:13px;
}

/* ================= TOAST ================= */

#toast{
 position:fixed;
 left:50%;
 bottom:145px;
 transform:translateX(-50%) translateY(20px);
 z-index:9999;
 opacity:0;
 pointer-events:none;
 padding:12px 17px;
 border-radius:14px;
 background:#292022;
 border:1px solid #4b383a;
 color:#fff;
 transition:.3s;
 white-space:nowrap;
}

#toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<!-- SPLASH -->

<div id="splash">
 <div class="splashLogo">Ish<span>yn</span></div>
 <div class="splashCredit">Developed by Shubham Rawat</div>
</div>

<div class="app">

<header>
 <div class="logo">Ish<span>yn</span></div>

 <button
  class="iconButton"
  onclick="showPage('settings')">
  ⚙
 </button>
</header>

<main id="main"></main>

</div>


<!-- PLAYER -->

<div id="player">

 <div class="playerRow">

  <div class="playerCover">♫</div>

  <div class="playerInfo">

   <div class="playerName" id="playerName">
    Nothing playing
   </div>

   <div class="playerArtist" id="playerArtist">
    Ishyn Music
   </div>

  </div>

  <div class="controls">

   <button onclick="previousSong()">⏮</button>

   <button
    id="playButton"
    class="main"
    onclick="togglePlay()">
    ▶
   </button>

   <button onclick="nextSong()">⏭</button>

  </div>

 </div>

 <input
  id="progress"
  type="range"
  min="0"
  max="100"
  value="0"
 >

</div>


<!-- NAVIGATION -->

<nav>

 <button
  id="navHome"
  class="active"
  onclick="showPage('home',this)">

  <span>⌂</span>
  Home

 </button>

 <button onclick="showPage('search',this)">
  <span>⌕</span>
  Search
 </button>

 <button onclick="showPage('songs',this)">
  <span>♫</span>
  Songs
 </button>

 <button onclick="showPage('liked',this)">
  <span>♡</span>
  Liked
 </button>

 <button onclick="showPage('settings',this)">
  <span>⚙</span>
  Settings
 </button>

</nav>


<audio id="audio" preload="metadata"></audio>

<div id="toast"></div>


<script>

/* ==================================================
   ISHYN MUSIC
   VERSION 2
   ACTUAL AUDIO FILE STORAGE WITH INDEXEDDB
================================================== */

const main =
 document.getElementById("main");

const audio =
 document.getElementById("audio");

const player =
 document.getElementById("player");

const playerName =
 document.getElementById("playerName");

const playerArtist =
 document.getElementById("playerArtist");

const playButton =
 document.getElementById("playButton");

const progress =
 document.getElementById("progress");

const toast =
 document.getElementById("toast");


const DB_NAME = "IshynMusicDatabase";
const DB_VERSION = 1;
const STORE_NAME = "songs";

let db = null;
let songs = [];
let currentIndex = -1;
let currentURL = null;


/* ==================================================
   TOAST
================================================== */

function showToast(message){

 toast.textContent = message;
 toast.classList.add("show");

 clearTimeout(window.toastTimer);

 window.toastTimer =
  setTimeout(()=>{
   toast.classList.remove("show");
  },2200);
}


/* ==================================================
   DATABASE OPEN
================================================== */

function openDatabase(){

 return new Promise((resolve,reject)=>{

  const request =
   indexedDB.open(DB_NAME,DB_VERSION);

  request.onupgradeneeded =
   function(event){

    const database =
     event.target.result;

    if(
     !database.objectStoreNames
     .contains(STORE_NAME)
    ){

     database.createObjectStore(
      STORE_NAME,
      {
       keyPath:"id",
       autoIncrement:true
      }
     );
    }
   };


  request.onsuccess =
   function(event){

    db = event.target.result;

    resolve(db);
   };


  request.onerror =
   function(){

    reject(request.error);
   };

 });
}


/* ==================================================
   LOAD ALL SONGS
================================================== */

function loadSongs(){

 return new Promise((resolve,reject)=>{

  if(!db){
   reject("Database not ready");
   return;
  }

  const transaction =
   db.transaction(
    STORE_NAME,
    "readonly"
   );

  const store =
   transaction.objectStore(STORE_NAME);

  const request =
   store.getAll();


  request.onsuccess =
   function(){

    songs =
     request.result || [];

    resolve(songs);
   };


  request.onerror =
   function(){

    reject(request.error);
   };

 });
}


/* ==================================================
   SAVE ONE SONG
================================================== */

function saveSong(file){

 return new Promise((resolve,reject)=>{

  const transaction =
   db.transaction(
    STORE_NAME,
    "readwrite"
   );

  const store =
   transaction.objectStore(STORE_NAME);


  const song = {

   name:
    file.name.replace(
     /\.[^/.]+$/,
     ""
    ),

   artist:
    "Local Music",

   blob:
    file,

   liked:
    false,

   added:
    Date.now()

  };


  const request =
   store.add(song);


  request.onsuccess =
   function(){

    resolve();
   };


  request.onerror =
   function(){

    reject(request.error);
   };

 });
}


/* ==================================================
   ADD LOCAL SONGS
================================================== */

async function addLocalSongs(files){

 if(!files || !files.length){
  return;
 }

 try{

  let added = 0;

  for(
   const file of Array.from(files)
  ){

   if(
    !file.type ||
    !file.type.startsWith("audio/")
   ){

    continue;
   }

   await saveSong(file);

   added++;
  }


  await loadSongs();

  if(added>0){

   showToast(
    added+
    " song"+
    (added===1?"":"s")+
    " saved 🎵"
   );

  }else{

   showToast(
    "Valid audio file nahi mili."
   );
  }


  renderHome();

 }catch(error){

  console.error(error);

  alert(
   "Song save nahi ho paya. Browser storage allow karo aur dobara try karo."
  );

 }
}


/* ==================================================
   PAGE SYSTEM
================================================== */

function showPage(page,button){

 document
  .querySelectorAll("nav button")
  .forEach(btn=>{
   btn.classList.remove("active");
  });


 if(button){

  button.classList.add("active");

 }else if(page==="home"){

  document
   .getElementById("navHome")
   .classList.add("active");

 }


 if(page==="home"){
  renderHome();
 }

 else if(page==="search"){
  renderSearch();
 }

 else if(page==="songs"){
  renderSongs();
 }

 else if(page==="liked"){
  renderLiked();
 }

 else if(page==="settings"){
  renderSettings();
 }

}


/* ==================================================
   HOME
================================================== */

function renderHome(){

 main.innerHTML = `

 <div class="hero">

  <h1>
   Welcome to Ishyn 🎧
  </h1>

  <p>
   Your personal music space.
   Save your favourite music and listen anytime.
  </p>

  <label class="primaryButton">

   ＋ Add Songs From Phone

   <input
    type="file"
    accept="audio/*"
    multiple
    hidden
    onchange="addLocalSongs(this.files)"
   >

  </label>

 </div>


 <div class="chips">

  <button class="chip active">
   All Music
  </button>

  <button class="chip">
   Romance
  </button>

  <button class="chip">
   Relax
  </button>

  <button class="chip">
   Party
  </button>

  <button class="chip">
   Feel Good
  </button>

 </div>


 <div class="sectionHeader">

  <div class="sectionTitle">
   Recently Added
  </div>

  <button
   class="more"
   onclick="showPage('songs')">

   See All →

  </button>

 </div>


 <div id="homeSongs"></div>


 <div class="sectionHeader">

  <div class="sectionTitle">
   Ishyn
  </div>

 </div>


 <div class="infoBox">

  🎵 <b>Your music. Your space.</b><br><br>

  Songs added from your phone are stored
  inside this browser's local database.
  Refresh karne par saved audio files
  automatically remain available.

 </div>

 `;


 renderSongList(
  document.getElementById("homeSongs"),
  songs
   .slice()
   .sort((a,b)=>
    (b.added||0)-(a.added||0)
   )
   .slice(0,7)
 );
}


/* ==================================================
   SONGS PAGE
================================================== */

function renderSongs(){

 main.innerHTML = `

 <button
  class="back"
  onclick="showPage('home')">
  ‹ Back
 </button>

 <div class="sectionTitle">
  My Songs 🎵
 </div>

 <div class="status infoBox">

  ${songs.length}
  song${songs.length===1?"":"s"}
  saved on this device.

 </div>


 <label class="primaryButton">

  ＋ Add MP3 / Audio

  <input
   type="file"
   accept="audio/*"
   multiple
   hidden
   onchange="addLocalSongs(this.files)"
  >

 </label>


 <div
  id="songsList"
  style="margin-top:20px">
 </div>

 `;


 renderSongList(
  document.getElementById("songsList"),
  songs
 );
}


/* ==================================================
   SEARCH
================================================== */

function renderSearch(){

 main.innerHTML = `

 <button
  class="back"
  onclick="showPage('home')">
  ‹ Back
 </button>

 <div class="sectionTitle"
  style="margin-bottom:15px">

  Search Music

 </div>


 <input
  id="searchInput"
  class="search"
  placeholder="Search your saved songs..."
  oninput="searchSongs(this.value)"
 >


 <div id="searchResults"></div>

 `;


 searchSongs("");
}


function searchSongs(query){

 const box =
  document.getElementById(
   "searchResults"
  );

 if(!box)return;


 query =
  String(query)
  .toLowerCase()
  .trim();


 if(!query){

  box.innerHTML = `

   <div class="empty">

    🔎<br><br>

    Search your saved songs<br>
    by song name or artist.

   </div>

  `;

  return;
 }


 const result =
  songs.filter(song=>{

   const name =
    String(song.name||"")
    .toLowerCase();

   const artist =
    String(song.artist||"")
    .toLowerCase();

   return(
    name.includes(query) ||
    artist.includes(query)
   );

  });


 renderSongList(box,result);
}


/* ==================================================
   LIKED
================================================== */

function renderLiked(){

 main.innerHTML = `

 <button
  class="back"
  onclick="showPage('home')">
  ‹ Back
 </button>

 <div class="sectionTitle">
  ❤️ Liked Songs
 </div>

 <div
  id="likedList"
  style="margin-top:18px">
 </div>

 `;


 const liked =
  songs.filter(song=>song.liked);


 renderSongList(
  document.getElementById(
   "likedList"
  ),
  liked
 );
}


/* ==================================================
   SONG LIST
================================================== */

function renderSongList(box,list){

 if(!box)return;


 if(!list.length){

  box.innerHTML = `

   <div class="empty">

    🎵<br><br>

    No songs here yet.<br><br>

    Add an MP3 from your phone.

   </div>

  `;

  return;
 }


 box.innerHTML="";


 list.forEach(song=>{

  const realIndex =
   songs.findIndex(
    item=>item.id===song.id
   );


  const div =
   document.createElement("div");

  div.className="song";


  div.innerHTML = `

   <div class="cover">
    ♫
   </div>


   <div class="songInfo">

    <div class="songName">
     ${escapeHTML(song.name)}
    </div>

    <div class="artist">
     ${escapeHTML(
      song.artist||"Local Music"
     )}
    </div>

   </div>


   <button
    class="likeButton ${
     song.liked?"active":""
    }"
    onclick="toggleLike(${realIndex})">

    ${song.liked?"♥":"♡"}

   </button>


   <button
    class="playButton"
    onclick="playSong(${realIndex})">

    ▶

   </button>

  `;


  box.appendChild(div);

 });
}


/* ==================================================
   PLAY SONG
================================================== */

function playSong(index){

 if(
  index<0 ||
  index>=songs.length
 ){

  return;
 }


 const song =
  songs[index];


 if(!song.blob){

  alert(
   "Audio file available nahi hai."
  );

  return;
 }


 currentIndex=index;


 if(currentURL){

  URL.revokeObjectURL(
   currentURL
  );

  currentURL=null;
 }


 currentURL =
  URL.createObjectURL(
   song.blob
  );


 audio.pause();

 audio.currentTime=0;

 audio.src=currentURL;

 playerName.textContent =
  song.name;

 playerArtist.textContent =
  song.artist||"Local Music";

 player.style.display="block";

 progress.value=0;


 audio.play()
 .then(()=>{

  playButton.textContent="⏸";

 })
 .catch(error=>{

  console.error(error);

  playButton.textContent="▶";

  alert(
   "Song play nahi ho raha. Dusri audio file try karo."
  );

 });
}


/* ==================================================
   PLAY / PAUSE
================================================== */

function togglePlay(){

 if(currentIndex<0){

  if(songs.length){

   playSong(0);

  }

  return;
 }


 if(audio.paused){

  audio.play()
  .then(()=>{

   playButton.textContent="⏸";

  })
  .catch(error=>{

   console.error(error);

  });

 }else{

  audio.pause();

  playButton.textContent="▶";

 }
}


/* ==================================================
   NEXT
================================================== */

function nextSong(){

 if(!songs.length)return;


 let next =
  currentIndex+1;


 if(next>=songs.length){

  next=0;

 }


 playSo

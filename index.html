<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Ishyn Music</title>
<meta name="theme-color" content="#0b0809">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#0b0809;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  padding-bottom:100px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:18px 18px 125px;
}

/* HEADER */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:34px;
  font-weight:800;
  letter-spacing:-1.5px;
}

.logo span{
  color:#ffb5b5;
}

.header-actions{
  display:flex;
  gap:10px;
}

.icon{
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid #3b2929;
  background:#171112;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.icon:active{
  transform:scale(.92);
}

/* SEARCH */

.search{
  width:100%;
  padding:16px 18px;
  border-radius:18px;
  border:1px solid #38292a;
  outline:none;
  background:#171112;
  color:white;
  margin-bottom:18px;
}

.search::placeholder{
  color:#8e8585;
}

.search:focus{
  border-color:#d99393;
}

/* HERO */

.hero{
  padding:25px 21px;
  border-radius:24px;
  margin-bottom:25px;

  background:
    radial-gradient(circle at 90% 10%,rgba(255,170,170,.18),transparent 40%),
    linear-gradient(145deg,#24191a,#120e0f);

  border:1px solid #38292a;
  box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.hero h1{
  margin:0 0 8px;
  font-size:29px;
}

.hero p{
  margin:0;
  color:#aaa0a0;
}

/* CATEGORY BUTTONS */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:25px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex-shrink:0;
  padding:13px 18px;
  border:0;
  border-radius:14px;
  background:#211718;
  color:#c0b4b4;
}

/* SECTION */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:25px 2px 14px;
}

.section-title{
  font-size:23px;
  font-weight:800;
}

.arrow{
  border:0;
  background:none;
  color:#ffb5b5;
  font-size:30px;
}

/* CARDS */

.card-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding-bottom:5px;
}

.card-row::-webkit-scrollbar{
  display:none;
}

.music-card{
  min-width:175px;
  max-width:175px;
}

.card-cover{
  width:175px;
  height:175px;
  border-radius:15px;
  background:linear-gradient(135deg,#5d3030,#171112);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  margin-bottom:9px;
  overflow:hidden;
}

.card-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-title{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
